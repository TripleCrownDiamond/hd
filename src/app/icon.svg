<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The tab icon. An emoji drawn as text: the browser renders it with the
       system emoji font, so it stays colourful at every size without shipping
       a bitmap. Replaces the missing /favicon.ico that was 404ing on every
       page load. -->
  <text x="32" y="34" font-size="56" text-anchor="middle" dominant-baseline="central">🔥</text>
</svg>
